<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="packetGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="20" cy="20" r="2" fill="url(#packetGradient)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 20 20 L 50 50" />
  </circle>
  <circle cx="50" cy="20" r="2" fill="url(#packetGradient)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 50 20 L 50 50" />
  </circle>
  <circle cx="80" cy="20" r="2" fill="url(#packetGradient)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 80 20 L 50 50" />
  </circle>
</svg>
